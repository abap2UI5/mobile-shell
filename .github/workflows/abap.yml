name: abap

# Lints the sample app (abap/src, what abapGit installs) against the current
# abap2UI5 main - a framework change that breaks the sample shows up here.
on:
  push:
    paths:
      - "abap/**"
      - "abaplint.json"
      - ".abapgit.xml"
      - ".github/workflows/abap.yml"
  pull_request:
    paths:
      - "abap/**"
      - "abaplint.json"
      - ".abapgit.xml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: abaplint against abap2UI5 main
        run: npx -y @abaplint/cli@latest abaplint.json
