name: abap

# Lints the sample app (abap/src, what abapGit installs) against the current
# abap2UI5 main - a framework change that breaks the sample shows up here.
on:
  push:
    paths:
      - "abap/**"
      - "abaplint.json"
      - ".abapgit.xml"
      - ".github/workflows/abap.yml"
  pull_request:
    paths:
      - "abap/**"
      - "abaplint.json"
      - ".abapgit.xml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: abaplint against abap2UI5 main
        run: npx -y @abaplint/cli@latest abaplint.json
