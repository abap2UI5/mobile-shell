name: bridge

# The shim is the one piece of the bridge that ships identically to both
# shells and runs inside customer apps — check its contract on every change,
# independently of the two (slow, platform-bound) shell builds.

on:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge.yml"
  pull_request:
    paths:
      - "bridge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The shells bundle byte-identical copies of the contract.
      - name: Verify bridge shim is in sync
        run: |
          diff bridge/native-bridge.js android/app/src/main/assets/native-bridge.js
          diff bridge/native-bridge.js ios/Resources/native-bridge.js

      - name: Contract tests
        run: node --test bridge/test/native-bridge.test.js
