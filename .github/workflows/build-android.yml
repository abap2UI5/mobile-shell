name: build_android

on:
  push:
    paths:
      - "android/**"
      - "bridge/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "bridge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The shim in the app must stay a byte-identical copy of the contract.
      - name: Verify bridge shim is in sync
        run: diff bridge/native-bridge.js android/app/src/main/assets/native-bridge.js

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abap2ui5-shell-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
