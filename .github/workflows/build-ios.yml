name: build_ios

on:
  push:
    paths:
      - "ios/**"
      - "bridge/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "bridge/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-15+ required: current XcodeGen writes Xcode project format 77,
    # which the Xcode 15.4 of the macos-14 image cannot open. Keep runner
    # image and XcodeGen in step — if this build ever fails with "future
    # Xcode project file format", the runner's Xcode is behind XcodeGen
    # again and the image needs bumping (versions are echoed below).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify bridge shim is in sync
        run: diff bridge/native-bridge.js ios/Resources/native-bridge.js

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version
          xcodegen generate

      - name: Build (simulator, unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Abap2UI5Shell.xcodeproj \
            -scheme Abap2UI5Shell \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # For tests on a simulator without a local Xcode build: unzip and
      # `xcrun simctl install booted Abap2UI5Shell.app` (docs/TESTING.md).
      # A real device needs a signed build from Xcode - this one only runs
      # in the simulator.
      - name: Package simulator app
        working-directory: ios/build/Build/Products/Debug-iphonesimulator
        run: ditto -c -k --keepParent Abap2UI5Shell.app "$GITHUB_WORKSPACE/Abap2UI5Shell-simulator.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abap2ui5-shell-ios-simulator
          path: Abap2UI5Shell-simulator.zip
